components:
  schemas:
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    Observation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        example_version:
          type: string
        closed:
          type: boolean
        record_count:
          type: integer
          maximum: 4
          minimum: 0
        deleted_count:
          type: integer
          maximum: 4
          minimum: 0
        expires_at:
          type: string
          format: date-time
      required:
      - closed
      - deleted_count
      - example_version
      - expires_at
      - id
      - record_count
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
    TaskPage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - count
      - next
      - previous
      - results
    TaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 去掉首尾空白后长度 1–200；拒绝纯空白、null、非字符串和 NUL。
      required:
      - title
      additionalProperties: false
