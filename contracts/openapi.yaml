components:
  schemas:
    ActionEnum:
      enum:
      - confirm
      - exclude
      - reset
      type: string
      description: |-
        * `confirm` - 确认
        * `exclude` - 排除
        * `reset` - 撤销
    AlgorithmEnum:
      enum:
      - bfs
      - dfs
      type: string
      description: |-
        * `bfs` - bfs
        * `dfs` - dfs
    Analysis:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_id:
          type: string
          format: uuid
          readOnly: true
        snapshot_id:
          type: string
          format: uuid
          readOnly: true
        root_urlconf:
          type: string
          readOnly: true
        rule_version:
          type: string
          readOnly: true
        coverage:
          allOf:
          - $ref: '#/components/schemas/Coverage'
          readOnly: true
        frontend:
          allOf:
          - $ref: '#/components/schemas/FrontendSummary'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - coverage
      - created_at
      - frontend
      - id
      - job_id
      - root_urlconf
      - rule_version
      - snapshot_id
    AnalysisInputRequest:
      type: object
      properties:
        root_urlconf:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - root_urlconf
      additionalProperties: false
    AnalysisVersion:
      type: object
      properties:
        analysis_id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        root_urlconf:
          type: string
        rule_version:
          type: string
        graph_version:
          type: string
          nullable: true
        frontend_rule_version:
          type: string
          nullable: true
        association_rule_version:
          type: string
          nullable: true
      required:
      - analysis_id
      - association_rule_version
      - frontend_rule_version
      - graph_version
      - root_urlconf
      - rule_version
      - snapshot_id
    ApplicabilityEnum:
      enum:
      - unchanged
      - review
      - deleted
      - unknown
      type: string
      description: |-
        * `unchanged` - unchanged
        * `review` - review
        * `deleted` - deleted
        * `unknown` - unknown
    AttemptFeedback:
      type: object
      properties:
        expected_answer: {}
        explanation:
          type: string
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
      required:
      - expected_answer
      - explanation
      - source_refs
    AttemptInputRequest:
      type: object
      description: 拒绝未知字段及隐式类型转换，保持请求摘要与用户输入一致。
      properties:
        snapshot_id:
          type: string
          format: uuid
        exercise_id:
          type: string
          format: uuid
        exercise_version:
          type: string
          minLength: 1
          maxLength: 40
        analysis_id:
          type: string
          format: uuid
        endpoint_index:
          type: integer
          maximum: 9999
          minimum: 0
        answer: {}
        hint_used:
          type: boolean
        previous_attempt_id:
          type: string
          format: uuid
          nullable: true
      required:
      - analysis_id
      - answer
      - endpoint_index
      - exercise_id
      - exercise_version
      - hint_used
      - snapshot_id
      additionalProperties: false
    AttemptReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        attempt_id:
          type: string
          format: uuid
        judgement:
          $ref: '#/components/schemas/JudgementEnum'
        note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempt_id
      - created_at
      - id
      - judgement
      - note
    AttemptReviewPage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AttemptReview'
      required:
      - count
      - next
      - previous
      - results
    CaseIdEnum:
      enum:
      - first
      - second
      type: string
      description: |-
        * `first` - first
        * `second` - second
    ChangedFieldsEnum:
      enum:
      - action
      - view
      - serializer
      - model
      - relations
      type: string
      description: |-
        * `action` - action
        * `view` - view
        * `serializer` - serializer
        * `model` - model
        * `relations` - relations
    ComparabilityEnum:
      enum:
      - comparable
      - files_only
      - incomparable
      type: string
      description: |-
        * `comparable` - comparable
        * `files_only` - files_only
        * `incomparable` - incomparable
    ComparisonFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_path:
          type: string
        change_type:
          $ref: '#/components/schemas/ComparisonFileChangeEnum'
        base_ref:
          allOf:
          - $ref: '#/components/schemas/SourceRef'
          nullable: true
        target_ref:
          allOf:
          - $ref: '#/components/schemas/SourceRef'
          nullable: true
        base_sha256:
          type: string
          nullable: true
        target_sha256:
          type: string
          nullable: true
      required:
      - base_ref
      - base_sha256
      - change_type
      - file_path
      - id
      - target_ref
      - target_sha256
    ComparisonFileChangeEnum:
      enum:
      - added
      - deleted
      - modified
      - unchanged
      type: string
      description: |-
        * `added` - added
        * `deleted` - deleted
        * `modified` - modified
        * `unchanged` - unchanged
    ComparisonFileDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_path:
          type: string
        change_type:
          $ref: '#/components/schemas/ComparisonFileChangeEnum'
        base_ref:
          allOf:
          - $ref: '#/components/schemas/SourceRef'
          nullable: true
        target_ref:
          allOf:
          - $ref: '#/components/schemas/SourceRef'
          nullable: true
        base_sha256:
          type: string
          nullable: true
        target_sha256:
          type: string
          nullable: true
        diff:
          type: string
        base_ranges:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
        target_ranges:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
      required:
      - base_ranges
      - base_ref
      - base_sha256
      - change_type
      - diff
      - file_path
      - id
      - target_ranges
      - target_ref
      - target_sha256
    ComparisonFilePage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonFile'
      required:
      - count
      - next
      - previous
      - results
    ComparisonHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          format: uuid
          readOnly: true
        job_id:
          type: string
          format: uuid
          readOnly: true
        job_status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        base_snapshot_id:
          type: string
          format: uuid
          readOnly: true
        target_snapshot_id:
          type: string
          format: uuid
          readOnly: true
        base_analysis_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        target_analysis_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        summary:
          allOf:
          - $ref: '#/components/schemas/FileSummary'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base_analysis_id
      - base_snapshot_id
      - created_at
      - id
      - job_id
      - job_status
      - project_id
      - summary
      - target_analysis_id
      - target_snapshot_id
    ComparisonHistoryPage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonHistory'
      required:
      - count
      - next
      - previous
      - results
    ComparisonImpact:
      type: object
      properties:
        comparison_id:
          type: string
          format: uuid
        change_id:
          type: string
          format: uuid
          nullable: true
        include_candidates:
          type: boolean
        base:
          $ref: '#/components/schemas/ImpactSide'
        target:
          $ref: '#/components/schemas/ImpactSide'
        limitations:
          type: array
          items:
            type: string
      required:
      - base
      - change_id
      - comparison_id
      - include_candidates
      - limitations
      - target
    ComparisonInputRequest:
      type: object
      description: 拒绝未知字段及隐式类型转换，保持请求摘要与用户输入一致。
      properties:
        base_snapshot_id:
